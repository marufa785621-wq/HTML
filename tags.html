<!DOCTYPE html>
<html>
    <head>
        <title>Text Formatting</title>
    </head>
    <body>
        <p><b>This text is bold.</b></p>
        <p><i>This text is italicized.</i></p>
        <p><u>This text is underlined.</u></p>
        <p>Water formula is H<sub>2</sub>O(subscript).</p>
        <p>Algebra equation:a<sup>2</sup>+b<sup>2</sup>(Superscript).</p>
    </body>
</html>
