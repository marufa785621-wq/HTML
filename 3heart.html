<!DOCTYPE html>
<html>
<head>
<style>
  .hearts {
    text-align: center;
    font-size: 80px;
    margin-top: 100px;
  }
  .heart {
    display: inline-block;
    color: red;
    animation: beat 1s infinite alternate;
    margin: 10px;
  }
  .heart:nth-child(2) { animation-delay: 0.2s; }
  .heart:nth-child(3) { animation-delay: 0.4s; }

  @keyframes beat {
    from { transform: scale(1); }
    to { transform: scale(1.3); }
  }
</style>
</head>
<body>
  <div class="hearts">
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>
</body>
</html>
