<!DOCTYPE html>
<html>
    <head>
        <title>HTML Lists</title>
    </head>
    <body>
        <h3>My Grocery List(Unordered)</h3>
        <ul>
            <li>Apples</li>
            <li>Milk</li>
            <li>Bread</li>
        </ul>

        <h3>Steps to Makes Tea(Ordered)</h3>
        <ol>
            <li>Boil water</li>
            <li>Add tea leaves</li>
            <li>Add sugar and milk</li>
        </ol>
    </body>
</html>
