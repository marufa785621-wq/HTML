<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form action="#">
        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option value="bsc">BSc Data Science</option>
            <option value="btech">BTech CSE</option>
            <option value="bca">BCA</option>
        </select><br><br>

        <label for="comments">Your Feedback:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50">Enter your comments here...</textarea><br><br>

        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
